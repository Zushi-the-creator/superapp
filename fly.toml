app = "superapp-ke5bhg"
primary_region = "ams"

[build]
  dockerfile = "backend/Dockerfile.prod"

[env]
  PYTHONUNBUFFERED = "1"
  LOG_LEVEL = "warning"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "stock_data"
  destination = "/app/data"

# fly.toml app configuration file generated for superapp-ke5bhg on 2026-02-14T11:07:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'superapp-ke5bhg'
primary_region = 'iad'

# Right-sized to 1GB (idle uses ~336MB; was 2GB). 512MB swap absorbs the daily
# 1000-stock scan/precompute spike so 1GB never OOMs. Saves ~40% of the bill
# while keeping the machine warm 24/7 (2026-07-11).
swap_size_mb = 512

[build]

[mounts]
  source = "stock_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Always-warm (2026-07-22): keep >=1 machine running 24/7. Reverses the
  # 2026-07-15 scale-to-zero experiment, which had TWO costs the ROI mandate
  # can't absorb: (1) wake latency — the first request after idle hangs while
  # the machine resumes into startup work (observed 34s), the "shuttering" feel;
  # (2) SCHEDULED REFRESH NEVER RAN — cache_refresh_loop / signal_tracker_loop
  # are in-process asyncio loops, so a machine suspended at 1 AM ET never ticks
  # them, leaving data stale until someone manually wakes the app. Freshness is
  # mandatory here, so a warm machine is required (the Yahoo-primary refresh fix
  # only helps if the loop actually runs). Cost: ~$6/mo for shared-cpu-1x/1GB
  # always-on vs near-zero suspended — cheap insurance for fresh data + no wake lag.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

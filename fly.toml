# fly.toml app configuration file generated for superapp-ke5bhg on 2026-02-14T11:07:41Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'superapp-ke5bhg'
primary_region = 'iad'

[build]

[mounts]
  source = "stock_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep one machine always warm so the daily refresh/precompute runs off-peak
  # (1 AM ET) and users always hit warm caches (~2-3s loads) instead of the
  # ~1-2 min wake-recompute window on the single shared CPU (2026-06-30).
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
